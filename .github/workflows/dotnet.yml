name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore EPM.TKT.slnx

    - name: Build
      run: |
        dotnet build Presentation/EPM.TKT.WebApi/EPM.TKT.WebApi.csproj                      --no-restore -c Release
        dotnet build Tests/EPM.TKT.AppTests/EPM.TKT.AppTests.csproj                         --no-restore -c Release
        dotnet build Tests/EPM.TKT.ArchitectureTests/EPM.TKT.ArchitectureTests.csproj       --no-restore -c Release
        dotnet build Tests/EPM.TKT.InfrastructureTests/EPM.TKT.InfrastructureTests.csproj   --no-restore -c Release
        dotnet build Tests/EPM.TKT.ExternalTests/EPM.TKT.ExternalTests.csproj               --no-restore -c Release
        dotnet build Tests/EPM.TKT.MediatorTests/EPM.TKT.MediatorTests.csproj               --no-restore -c Release
        dotnet build Tests/EPM.TKT.WebAPITests/EPM.TKT.WebAPITests.csproj                   --no-restore -c Release
        dotnet build Tests/EPM.TKT.IntegrationTests/EPM.TKT.IntegrationTests.csproj         --no-restore -c Release

    - name: Test
      run: |
        dotnet test Tests/EPM.TKT.AppTests/EPM.TKT.AppTests.csproj                         --no-build -c Release --logger "trx;LogFileName=AppTests.trx"
        dotnet test Tests/EPM.TKT.ArchitectureTests/EPM.TKT.ArchitectureTests.csproj       --no-build -c Release --logger "trx;LogFileName=ArchitectureTests.trx"
        dotnet test Tests/EPM.TKT.InfrastructureTests/EPM.TKT.InfrastructureTests.csproj   --no-build -c Release --logger "trx;LogFileName=InfrastructureTests.trx"
        dotnet test Tests/EPM.TKT.ExternalTests/EPM.TKT.ExternalTests.csproj               --no-build -c Release --logger "trx;LogFileName=ExternalTests.trx"
        dotnet test Tests/EPM.TKT.MediatorTests/EPM.TKT.MediatorTests.csproj               --no-build -c Release --logger "trx;LogFileName=MediatorTests.trx"
        dotnet test Tests/EPM.TKT.WebAPITests/EPM.TKT.WebAPITests.csproj                   --no-build -c Release --logger "trx;LogFileName=WebAPITests.trx"
        dotnet test Tests/EPM.TKT.IntegrationTests/EPM.TKT.IntegrationTests.csproj         --no-build -c Release --logger "trx;LogFileName=IntegrationTests.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: test-results
        path: "**/TestResults/*.trx"
